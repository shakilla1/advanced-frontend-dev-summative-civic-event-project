<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f766e'/></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events | CivicEvents</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
  <header id="app-header"></header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <h1 class="text-2xl font-bold text-slate-900">Upcoming events</h1>
      <a id="new-event" href="event-form.html" class="hidden bg-teal-700 hover:bg-teal-800 text-white text-sm font-medium px-4 py-2 rounded-lg">New event</a>
    </div>

    <form id="filters" class="grid gap-3 sm:grid-cols-4 mb-6">
      <div class="sm:col-span-2">
        <label for="f-q" class="block text-sm font-medium text-slate-700">Search</label>
        <input id="f-q" type="search" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
      </div>
      <div>
        <label for="f-date" class="block text-sm font-medium text-slate-700">Date</label>
        <input id="f-date" type="date" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
      </div>
      <div>
        <label for="f-location" class="block text-sm font-medium text-slate-700">Location</label>
        <select id="f-location" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 bg-white">
          <option value="">All locations</option>
        </select>
      </div>
    </form>

    <div id="events-grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3" aria-live="polite"></div>
    <nav id="pager" class="flex items-center justify-center gap-3 mt-8" aria-label="Pagination"></nav>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/events.js"></script>
</body>
</html>
