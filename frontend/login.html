<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f766e'/></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | CivicEvents</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4">
  <main class="w-full max-w-md bg-white rounded-2xl shadow p-8">
    <h1 class="text-2xl font-bold text-slate-900">Welcome back</h1>
    <p class="text-slate-600 mt-1 mb-6">Log in to see what's happening in your city.</p>

    <form id="login-form" novalidate class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
        <input id="email" type="email" autocomplete="email" required
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-600">
        <p id="email-error" class="text-sm text-red-700 mt-1 hidden"></p>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
        <input id="password" type="password" autocomplete="current-password" required
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-600">
        <p id="password-error" class="text-sm text-red-700 mt-1 hidden"></p>
      </div>

      <label class="flex items-center gap-2 text-sm text-slate-700">
        <input id="remember" type="checkbox" class="rounded"> Keep me logged in on this device
      </label>

      <button id="login-btn" type="submit"
        class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium rounded-lg py-2.5 disabled:opacity-60">
        Log in
      </button>
    </form>

    <p class="text-sm text-slate-600 mt-6 text-center">
      New here? <a href="signup.html" class="text-teal-700 font-medium underline">Create an account</a>
    </p>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
