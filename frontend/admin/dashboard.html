<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f766e'/></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | CivicEvents</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
  <header id="app-header"></header>

  <div class="flex-1 max-w-6xl w-full mx-auto px-4 py-8 grid gap-6 md:grid-cols-5">
    <aside id="admin-nav" class="md:col-span-1"></aside>

    <main class="md:col-span-4">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-slate-900">Dashboard</h1>
        <button id="refresh" class="text-sm border border-slate-300 bg-white hover:bg-slate-50 rounded-lg px-4 py-2">Refresh</button>
      </div>
      <p id="updated" class="text-xs text-slate-500 -mt-4 mb-4" aria-live="polite"></p>
      <div id="stats" class="grid gap-4 sm:grid-cols-2" aria-live="polite"></div>
      <div id="charts" class="grid gap-4 lg:grid-cols-2 mt-6"></div>
    </main>
  </div>

  <footer id="app-footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script>Auth.requireAdmin();</script>
  <script src="../js/layout.js"></script>
  <script src="../js/admin-nav.js"></script>
  <script src="../js/pages/dashboard.js"></script>
</body>
</html>
