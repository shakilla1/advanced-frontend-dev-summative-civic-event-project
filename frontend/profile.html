<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f766e'/></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My profile | CivicEvents</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
  <header id="app-header"></header>

  <main class="flex-1 max-w-xl w-full mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-slate-900 mb-6">My profile</h1>

    <form id="profile-form" novalidate class="bg-white rounded-xl shadow p-6 space-y-5">
      <div>
        <label for="full_name" class="block text-sm font-medium text-slate-700">Full name</label>
        <input id="full_name" type="text" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
        <p id="full_name-error" class="field-error hidden text-sm text-red-700 mt-1"></p>
      </div>
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
        <input id="email" type="email" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
        <p id="email-error" class="field-error hidden text-sm text-red-700 mt-1"></p>
      </div>
      <dl class="grid grid-cols-2 gap-4 text-sm">
        <div><dt class="font-medium text-slate-500">Role</dt><dd id="role" class="text-slate-900 capitalize"></dd></div>
        <div><dt class="font-medium text-slate-500">Account status</dt><dd id="status" class="text-slate-900"></dd></div>
      </dl>
      <button id="save-btn" type="submit" class="bg-teal-700 hover:bg-teal-800 text-white font-medium px-5 py-2 rounded-lg disabled:opacity-60">Save changes</button>
    </form>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/profile.js"></script>
</body>
</html>
