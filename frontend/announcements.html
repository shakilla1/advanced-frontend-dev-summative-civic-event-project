<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f766e'/></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Announcements | CivicEvents</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col">
    <header id="app-header"></header>

    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold text-slate-900 mb-6">Announcements</h1>

        <section id="admin-box" class="hidden bg-white rounded-xl shadow p-6 mb-8">
            <h2 class="text-lg font-semibold text-slate-900 mb-4">New audio announcement</h2>
            <form id="announcement-form" novalidate class="space-y-4">
                <div>
                    <label for="title" class="block text-sm font-medium text-slate-700">Title</label>
                    <input id="title" type="text" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
                    <p id="title-error" class="field-error hidden text-sm text-red-700 mt-1"></p>
                </div>
                <div>
                    <label for="audio" class="block text-sm font-medium text-slate-700">Audio file (MP3, WAV or M4A, up
                        to 5 MB)</label>
                    <input id="audio" type="file" accept=".mp3,.wav,.m4a,.ogg" class="mt-1 block w-full text-sm">
                    <p id="audio-error" class="field-error hidden text-sm text-red-700 mt-1"></p>
                </div>
                <label class="flex items-center gap-2 text-sm text-slate-700">
                    <input id="published" type="checkbox" checked class="rounded"> Publish immediately
                </label>
                <div id="progress-wrap" class="hidden">
                    <div class="h-2 bg-slate-200 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-2 bg-teal-700 w-0 transition-all"></div>
                    </div>
                    <p id="progress-text" class="text-xs text-slate-600 mt-1" aria-live="polite"></p>
                </div>
                <button id="save-btn" type="submit"
                    class="bg-teal-700 hover:bg-teal-800 text-white font-medium px-5 py-2 rounded-lg disabled:opacity-60">Upload
                    announcement</button>
            </form>
        </section>

        <ul id="list" class="space-y-4" aria-live="polite"></ul>
    </main>

    <footer id="app-footer"></footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/pages/announcements.js"></script>
</body>

</html>
