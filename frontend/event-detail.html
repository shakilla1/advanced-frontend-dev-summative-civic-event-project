<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f766e'/></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Event | CivicEvents</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col">
    <header id="app-header"></header>

    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
        <a href="events.html" class="text-sm text-teal-700 underline">&larr; Back to events</a>

        <section id="event-view" class="mt-4" aria-live="polite">
            <div class="animate-pulse bg-white rounded-xl shadow overflow-hidden">
                <div class="h-64 bg-slate-200"></div>
                <div class="p-6 space-y-3">
                    <div class="h-6 bg-slate-200 rounded w-2/3"></div>
                    <div class="h-4 bg-slate-200 rounded w-1/3"></div>
                    <div class="h-4 bg-slate-200 rounded w-full"></div>
                </div>
            </div>
        </section>

        <section id="attendees-box" class="hidden mt-8 bg-white rounded-xl shadow p-6">
            <h2 class="text-lg font-semibold text-slate-900 mb-3">Registered attendees</h2>
            <ul id="attendees" class="divide-y divide-slate-100"></ul>
        </section>
        <section id="reviews-box" class="hidden mt-8 bg-white rounded-xl shadow p-6">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-lg font-semibold text-slate-900">Feedback</h2>
                <p id="average" class="text-sm text-slate-700"></p>
            </div>
            <ul id="reviews" class="divide-y divide-slate-100"></ul>
        </section>

        <section id="feedback-box" class="hidden mt-8 bg-white rounded-xl shadow p-6">
            <h2 id="feedback-title" class="text-lg font-semibold text-slate-900 mb-3">Leave feedback</h2>
            <form id="feedback-form" novalidate class="space-y-4">
                <fieldset>
                    <legend class="text-sm font-medium text-slate-700">Rating</legend>
                    <div class="mt-2 flex gap-4">
                        <label class="flex items-center gap-1 text-sm"><input type="radio" name="rating" value="1">
                            1</label>
                        <label class="flex items-center gap-1 text-sm"><input type="radio" name="rating" value="2">
                            2</label>
                        <label class="flex items-center gap-1 text-sm"><input type="radio" name="rating" value="3">
                            3</label>
                        <label class="flex items-center gap-1 text-sm"><input type="radio" name="rating" value="4">
                            4</label>
                        <label class="flex items-center gap-1 text-sm"><input type="radio" name="rating" value="5">
                            5</label>
                    </div>
                    <p id="rating-error" class="hidden text-sm text-red-700 mt-1"></p>
                </fieldset>
                <div>
                    <label for="comment" class="block text-sm font-medium text-slate-700">Comment</label>
                    <textarea id="comment" rows="3"
                        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"></textarea>
                    <p id="comment-error" class="hidden text-sm text-red-700 mt-1"></p>
                </div>
                <button id="feedback-btn" type="submit"
                    class="bg-teal-700 hover:bg-teal-800 text-white font-medium px-5 py-2 rounded-lg disabled:opacity-60">Submit
                    feedback</button>
            </form>
        </section>
    </main>

    <footer id="app-footer"></footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/pages/event-detail.js"></script>
</body>

</html>
