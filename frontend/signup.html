<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f766e'/></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | CivicEvents</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4 py-10">
  <main class="w-full max-w-md bg-white rounded-2xl shadow p-8">
    <h1 class="text-2xl font-bold text-slate-900">Create your account</h1>
    <p class="text-slate-600 mt-1 mb-6">Join to discover and register for events in your city.</p>

    <form id="signup-form" novalidate class="space-y-4">
      <div>
        <label for="full_name" class="block text-sm font-medium text-slate-700">Full name</label>
        <input id="full_name" type="text" autocomplete="name" required
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-600">
        <p id="full_name-error" class="field-error hidden text-sm text-red-700 mt-1"></p>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
        <input id="email" type="email" autocomplete="email" required
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-600">
        <p id="email-error" class="field-error hidden text-sm text-red-700 mt-1"></p>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
        <input id="password" type="password" autocomplete="new-password" required
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-600">
        <div class="mt-2" aria-live="polite">
          <div class="h-2 bg-slate-200 rounded-full overflow-hidden">
            <div id="strength-bar" class="h-2 w-0 rounded-full transition-all"></div>
          </div>
          <p id="strength-text" class="text-xs text-slate-600 mt-1">Use 8+ characters with upper, lower, a number and a symbol.</p>
        </div>
        <p id="password-error" class="field-error hidden text-sm text-red-700 mt-1"></p>
      </div>

      <div>
        <label for="confirm_password" class="block text-sm font-medium text-slate-700">Confirm password</label>
        <input id="confirm_password" type="password" autocomplete="new-password" required
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-600">
        <p id="confirm_password-error" class="field-error hidden text-sm text-red-700 mt-1"></p>
      </div>

      <button id="signup-btn" type="submit"
        class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium rounded-lg py-2.5 disabled:opacity-60">
        Create account
      </button>
    </form>

    <p class="text-sm text-slate-600 mt-6 text-center">
      Already have an account? <a href="login.html" class="text-teal-700 font-medium underline">Log in</a>
    </p>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/signup.js"></script>
</body>
</html>
