<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f766e'/></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event | CivicEvents</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
  <header id="app-header"></header>

  <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-8">
    <h1 id="form-title" class="text-2xl font-bold text-slate-900 mb-6">New event</h1>

    <form id="event-form" novalidate class="bg-white rounded-xl shadow p-6 space-y-5">
      <div>
        <label for="title" class="block text-sm font-medium text-slate-700">Title</label>
        <input id="title" type="text" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
        <p id="title-error" class="field-error hidden text-sm text-red-700 mt-1"></p>
      </div>

      <div>
        <label for="description" class="block text-sm font-medium text-slate-700">Description</label>
        <textarea id="description" rows="4" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"></textarea>
        <p id="description-error" class="field-error hidden text-sm text-red-700 mt-1"></p>
      </div>

      <div>
        <label for="location" class="block text-sm font-medium text-slate-700">Location</label>
        <input id="location" type="text" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
        <p id="location-error" class="field-error hidden text-sm text-red-700 mt-1"></p>
      </div>

      <div class="grid gap-5 sm:grid-cols-2">
        <div>
          <label for="starts_at" class="block text-sm font-medium text-slate-700">Starts</label>
          <input id="starts_at" type="datetime-local" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
          <p id="starts_at-error" class="field-error hidden text-sm text-red-700 mt-1"></p>
        </div>
        <div>
          <label for="ends_at" class="block text-sm font-medium text-slate-700">Ends</label>
          <input id="ends_at" type="datetime-local" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
          <p id="ends_at-error" class="field-error hidden text-sm text-red-700 mt-1"></p>
        </div>
      </div>

      <div>
        <label for="image" class="block text-sm font-medium text-slate-700">Event image (JPG, PNG or GIF, up to 2 MB)</label>
        <input id="image" type="file" accept=".jpg,.jpeg,.png,.gif" class="mt-1 block w-full text-sm">
        <p id="image-error" class="field-error hidden text-sm text-red-700 mt-1"></p>
        <img id="preview" alt="Selected event image preview" class="hidden mt-3 h-48 w-full object-cover rounded-lg">
      </div>

      <div id="progress-wrap" class="hidden">
        <div class="h-2 bg-slate-200 rounded-full overflow-hidden">
          <div id="progress-bar" class="h-2 bg-teal-700 w-0 transition-all"></div>
        </div>
        <p id="progress-text" class="text-xs text-slate-600 mt-1" aria-live="polite"></p>
      </div>

      <div class="flex items-center gap-3">
        <button id="save-btn" type="submit" class="bg-teal-700 hover:bg-teal-800 text-white font-medium px-5 py-2 rounded-lg disabled:opacity-60">Save event</button>
        <a href="events.html" class="text-sm text-slate-700 underline">Cancel</a>
      </div>
    </form>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/event-form.js"></script>
</body>
</html>
