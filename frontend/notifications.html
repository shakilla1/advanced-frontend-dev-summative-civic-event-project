<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f766e'/></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications | CivicEvents</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
  <header id="app-header"></header>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-slate-900 mb-6">Notifications</h1>
    <div class="grid gap-6 md:grid-cols-5">
      <ul id="list" class="md:col-span-2 space-y-2" aria-live="polite"></ul>
      <section id="detail" class="md:col-span-3 bg-white rounded-xl shadow p-6 min-h-48" aria-live="polite">
        <p class="text-slate-600">Select a notification to read it.</p>
      </section>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/notifications.js"></script>
</body>
</html>
